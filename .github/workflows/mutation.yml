name: mutation

# Does the suite NOTICE when the code changes?
#
# 100% line coverage says every line ran, not that anything would fail if it behaved differently. The
# gap is not academic here: 25 of 30 `?? default` guards could be deleted one at a time with the whole
# suite green, and the tests that were supposed to pin them had been written alongside the very change
# they were meant to catch. Mutation testing asks the other question, and does not care what anyone
# believed while writing the test.
#
# The full run is NIGHTLY, and that is the gate: a regression surfaces within a day, on a diff that
# says which class moved. A PR can ask for the same check on the files it touches by carrying the
# `mutation` label — minutes for an action, most of an hour for the service provider, so it is opt-in
# rather than a toll on every push.
#
# Both jobs patch the plugin first (`.github/scripts/patch-pest-mutate.php`) and run through
# `.github/scripts/run-mutation.sh`. Without the patch the score is not a measurement: until 2026-11-14
# about a fifth of the package's mutants were reported killed by child processes that had run no test.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 03:20 UTC, off the hour to avoid the scheduling stampede GitHub warns about.
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'mutation')
    runs-on: ubuntu-latest
    # `--class` is a PREFIX match, so a PR touching 20 classes can mutate 44 files / ~1,700 mutants.
    # What it costs depends on WHICH classes: a mutant in an action runs a handful of tests, one in
    # `LukkServiceProvider` or `Lukk` runs most of the suite (9 minutes for the provider alone on ten
    # local processes when every mutant is caught, twice that when some survive — a 4-vCPU runner is
    # three to four times slower). Cancelled mid-run reads as a failure and tells nobody anything.
    timeout-minutes: 120
    name: Mutation score (changed files, label `mutation`)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to exist locally for the diff below to name anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: xdebug
          ini-values: zend.assertions=1

      # paratest 7.28.0 (2026-11-12) groups `SuiteLoader::$tests`, and Pest <= 5.3.5 crashes on it in every
      # `--parallel` run (`WrapperRunner::getTestFiles(): Argument #1 must be of type string, array given`).
      # Fixed upstream in pestphp/pest#2025; drop the `--with` once a Pest release carries it.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with 'brianium/paratest:<7.28.0'

      # Unpatched, the plugin reports kills it never measured: a mutant most of the suite covers gets a
      # `--filter` PCRE cannot compile, its child runs no test at all, and the non-zero exit is scored as
      # caught. The script explains itself, is idempotent, and fails the job if it cannot apply.
      - name: Patch the mutation plugin so a mutant that ran no test is not a kill
        run: php .github/scripts/patch-pest-mutate.php

      - name: Mutate the classes this PR touches
        env:
          # Through the environment, never interpolated into the script: a ref name is somebody's text.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          # `--class` takes PSR-4 names, so map `src/Foo/Bar.php` → `Lukk\Foo\Bar`. Only files that
          # still exist (a deleted one has no class to mutate), and only class files — `src/routes/*.php`
          # is a route manifest, not a class, and naming it would filter everything out.
          classes="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'src/**.php' \
            | { grep -E '^src/([A-Z][^/]*/)*[A-Z][^/]*\.php$' || true; } \
            | sed -E 's#^src/#Lukk/#; s#\.php$##; s#/#\\#g' \
            | paste -sd, -)"
          if [ -z "$classes" ]; then
            echo "No mutable src/ classes changed — nothing to do."
            exit 0
          fi
          echo "Mutating: $classes"
          # The SAME floor the nightly run uses (`run-mutation.sh` holds it), not 100. A demand for 100 here would fail nearly every
          # pull request — a new class arrives with survivors before its tests do — and a gate that is always red gets
          # switched off, which is worse than no gate. This one fires when a change makes the classes it
          # touches measurably worse. Paying the debt down is done by raising the floor, deliberately.
          .github/scripts/run-mutation.sh --class="$classes"

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Sharded by path, because three files are not like the rest. The service provider, the `Lukk` hub
    # and the route manifest run on every request, so nearly every test covers their lines: a mutant
    # there has to run most of the suite to be judged, where a mutant in an action runs a handful of
    # tests. In one job those three set the pace for everything queued behind them; apart, each shard
    # finishes on its own clock and a red one names where to look. `fail-fast` is off so one shard's
    # survivors do not cancel the others' answers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: service provider
            args: --path=src/LukkServiceProvider.php
          - shard: Lukk hub
            args: --path=src/Lukk.php
          - shard: routes
            args: --path=src/routes
          - shard: everything else
            args: --ignore=src/LukkServiceProvider.php,src/Lukk.php,src/routes
    # A job killed by its timeout prints no score at all, so the margin is deliberate. Measured on ten
    # local processes, 2026-11-14: provider 9-19 minutes, hub 2-3, routes 5-16, everything else 19 — the
    # longer figure when mutants survive, since a survivor runs all of its tests and a kill stops at
    # the first failure. A 4-vCPU runner has taken 3.7x the local time.
    timeout-minutes: 150
    name: Mutation score (${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: xdebug
          ini-values: zend.assertions=1

      # paratest 7.28.0 (2026-11-12) groups `SuiteLoader::$tests`, and Pest <= 5.3.5 crashes on it in every
      # `--parallel` run (`WrapperRunner::getTestFiles(): Argument #1 must be of type string, array given`).
      # Fixed upstream in pestphp/pest#2025; drop the `--with` once a Pest release carries it.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with 'brianium/paratest:<7.28.0'

      # Unpatched, the plugin reports kills it never measured: a mutant most of the suite covers gets a
      # `--filter` PCRE cannot compile, its child runs no test at all, and the non-zero exit is scored as
      # caught. The script explains itself, is idempotent, and fails the job if it cannot apply.
      - name: Patch the mutation plugin so a mutant that ran no test is not a kill
        run: php .github/scripts/patch-pest-mutate.php

      # The floor is 99 (`run-mutation.sh`), just under what the package measures. Raise it as the score
      # rises — never lower it to turn a build green. The PR job above uses the same number. A timeout
      # fails the shard: it is not a kill.
      - name: Mutation score
        run: .github/scripts/run-mutation.sh --everything ${{ matrix.args }}
