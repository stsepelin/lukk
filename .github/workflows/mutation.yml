name: mutation

# Does the suite NOTICE when the code changes?
#
# 100% line coverage says every line ran, not that anything would fail if it behaved differently. The
# gap is not academic here: 25 of 30 `?? default` guards could be deleted one at a time with the whole
# suite green, and the tests that were supposed to pin them had been written alongside the very change
# they were meant to catch. Mutation testing asks the other question, and does not care what anyone
# believed while writing the test.
#
# PRs are scoped to the files they touch, so the feedback is fast and lands before merge. The full run
# is nightly, because it is minutes rather than seconds and nothing about it needs to block a push.

on:
  pull_request:
  schedule:
    # 03:20 UTC, off the hour to avoid the scheduling stampede GitHub warns about.
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Mutation score (changed files)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base has to exist locally for the diff below to name anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mutate the classes this PR touches
        run: |
          set -euo pipefail
          base="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          # `--class` takes PSR-4 names, so map `src/Foo/Bar.php` → `Lukk\Foo\Bar`. Only files that
          # still exist (a deleted one has no class to mutate), and only class files — `src/routes/*.php`
          # is a route manifest, not a class, and naming it would filter everything out.
          classes="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- 'src/**.php' \
            | grep -E '^src/([A-Z][^/]*/)*[A-Z][^/]*\.php$' \
            | sed -E 's#^src/#Lukk/#; s#\.php$##; s#/#\\#g' \
            | paste -sd, -)"
          if [ -z "$classes" ]; then
            echo "No mutable src/ classes changed — nothing to do."
            exit 0
          fi
          echo "Mutating: $classes"
          # The SAME floor the nightly run uses, not 100. A demand for 100 here would fail nearly every
          # pull request — the package sits in the low eighties — and a gate that is always red gets
          # switched off, which is worse than no gate. This one fires when a change makes the classes it
          # touches measurably worse. Paying the debt down is done by raising the floor, deliberately.
          XDEBUG_MODE=coverage vendor/bin/pest --mutate --parallel --covered-only --min=81 \
            --class="$classes"

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Measured at 26.5 minutes on 10 local processes; a 4-vCPU runner takes roughly two and a half times
    # that. A job killed by its timeout prints no score at all, so the margin is deliberate.
    timeout-minutes: 120
    name: Mutation score (whole package)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The measured floor: 81.49% on 2026-09-19, with exactly these flags (3,345 mutants; timeouts
      # count as caught here, as they do in Pest's own score). Raise it as the score rises — never
      # lower it to turn a build green. The PR job above uses the same number.
      - name: Mutation score
        run: XDEBUG_MODE=coverage vendor/bin/pest --mutate --parallel --covered-only --everything --min=81
