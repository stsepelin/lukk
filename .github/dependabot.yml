version: 2

updates:
  # Actions are pinned to commit SHAs so an upstream tag repoint can't run unreviewed code with the
  # workflow token. That only stays safe if something bumps them — a pinned SHA never receives a
  # security fix on its own. Dependabot rewrites the SHA and the `# version` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # No committed lock file — this is a library, so `composer.lock` is gitignored and every install
  # resolves fresh within the declared ranges. That means a transitive advisory (Laravel pulls in
  # guzzle, commonmark and a few dozen others) clears itself on the next install; there is nothing
  # here for Dependabot to bump on that account.
  #
  # What it IS for: the declared constraints in composer.json. Those go stale silently — a new
  # major of pest or testbench, or of firebase/php-jwt, never gets tested until someone widens the
  # range by hand. Grouped, and low-noise by construction: the package has ONE runtime dependency
  # and everything else is the test harness.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ['*']
