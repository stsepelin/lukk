version: 2

updates:
  # Actions are pinned to commit SHAs so an upstream tag repoint can't run unreviewed code with the
  # workflow token. That only stays safe if something bumps them — a pinned SHA never receives a
  # security fix on its own. Dependabot rewrites the SHA and the `# version` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The lock file is committed, so a transitive advisory (Laravel pulls in guzzle, commonmark and
  # a few dozen others) only clears when something bumps it. Dev-only by nature: the package itself
  # has ONE runtime dependency, and everything else here is the test harness.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ['*']
